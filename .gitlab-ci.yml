# Kinetix notification CI — GitLab.
#
# ⚠ PAIRED FILE: .github/workflows/ci.yml
# `origin` is GitHub and GitLab is a mirror. Both assert the same things and must be changed
# together; if they drift, the two platforms disagree about whether the same commit is good.

include:
  - project: 'WildanFrananda/kinetix-infrastructure'
    ref: main
    file: '/ci/service-ci.yml'

stages:
  - verify
  - build
  - test

variables:
  SBT_OPTS: "-Xmx2G"

.scala:
  image: sbtscala/scala-sbt:eclipse-temurin-21.0.5_11_1.10.7_3.3.4
  cache:
    key:
      files:
        - build.sbt
        - project/plugins.sbt
    paths:
      - .cache/coursier
      - .cache/sbt
  before_script:
    - sh bin/sync-contracts

secret-scan:
  extends: .secret-scan

build-image:
  extends: .build-image

compile:
  extends: .scala
  stage: verify
  script:
    # -Xfatal-warnings with -Wunused:all and -Wnonunit-statement: a build that passes here is a
    # stronger statement than it is in most repositories.
    - sbt -batch compile
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:
  extends: .scala
  stage: test
  # PostgresStoreSuite runs against this, and fails rather than skips under CI when it is missing.
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: ci
    POSTGRES_PASSWORD: ci-ephemeral-not-a-deployed-credential
    POSTGRES_DB: notification_test
    POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    NOTIFICATION_TEST_DATABASE_URL: jdbc:postgresql://postgres:5432/notification_test
    NOTIFICATION_TEST_DB_USERNAME: ci
    NOTIFICATION_TEST_DB_PASSWORD: ci-ephemeral-not-a-deployed-credential
  script:
    - sbt -batch test
    # A suite that discovers nothing is a failed suite.
    - sbt -batch "show Test/definedTests" > tests.txt
    - for suite in NotifySuite PostgresStoreSuite GrpcCallerSuite; do grep -q "$suite" tests.txt || { echo "the suite discovered no $suite"; cat tests.txt; exit 1; }; done
    - sbt -batch assembly
    - cd "$(mktemp -d)" && jar xf "$CI_PROJECT_DIR/target/scala-3.3.4/kinetix-notification-service.jar" META-INF/MANIFEST.MF && grep -q '^Main-Class: com.kinetix.notification.Main' META-INF/MANIFEST.MF || { echo "the jar names no Main-Class"; exit 1; }
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
