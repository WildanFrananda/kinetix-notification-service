# Kinetix notification CI — GitHub.
#
# ⚠ PAIRED FILE: .gitlab-ci.yml
# `origin` is GitHub and GitLab is a mirror. Both assert the same things and must be changed
# together; if they drift, the two platforms disagree about whether the same commit is good.
#
# The job that matters here is `build`. This service's rules are enforced by the compiler —
# `-Xfatal-warnings` with `-Wunused:all` and `-Wnonunit-statement` — so a build that passes is a
# stronger statement than it is in most repositories.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Named `test`, not `build`: build-and-push.yml will carry a job called `build` that runs only
  # on a push to main. Two checks with one name is a required check that can never start.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # PostgresStoreSuite runs against this. Under CI it fails rather than skips when the database is
    # missing: the idempotency constraint and the jsonb cast live only in Postgres, and a fake
    # repository passed for a month while every real insert failed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-ephemeral-not-a-deployed-credential
          POSTGRES_DB: notification_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U ci -d notification_test"
          --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      NOTIFICATION_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/notification_test
      NOTIFICATION_TEST_DB_USERNAME: ci
      NOTIFICATION_TEST_DB_PASSWORD: ci-ephemeral-not-a-deployed-credential

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      # The contracts come from the contract repository at a pinned tag. This is also the check
      # that the pin is real: bin/sync-contracts refuses a tag that resolves to a different commit.
      - name: Fetch the wire contracts
        run: sh bin/sync-contracts

      - name: Compile, with warnings as errors
        run: sbt -batch compile

      - name: Test
        run: sbt -batch test

      # A suite that discovers nothing is a failed suite. This service's whole test story is the
      # tagless-final boundary, and "0 tests, success" would report that story as working.
      - name: The suite must have run something
        run: |
          sbt -batch "show Test/definedTests" > tests.txt
          for suite in NotifySuite PostgresStoreSuite GrpcCallerSuite; do
            grep -q "$suite" tests.txt || {
              echo "the test suite discovered no $suite; the tests did not run"
              cat tests.txt
              exit 1
            }
          done

      - name: The jar must assemble
        run: sbt -batch assembly

      - name: The jar must name the class java -jar starts
        run: |
          cd "$(mktemp -d)"
          jar xf "$GITHUB_WORKSPACE/target/scala-3.3.4/kinetix-notification-service.jar" META-INF/MANIFEST.MF
          grep -q '^Main-Class: com.kinetix.notification.Main' META-INF/MANIFEST.MF || {
            echo "the jar names no Main-Class, so the image's java -jar exits at once"
            cat META-INF/MANIFEST.MF
            exit 1
          }
